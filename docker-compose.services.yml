version: '3.8'

services:
  # ============================================================================
  # egov-user service
  # ============================================================================
  egov-user:
    build:
      context: ./services/egov-user
      dockerfile: Dockerfile
    container_name: digit-egov-user
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/egov_user
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./shared/storage:/data
      - ./shared/config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - digit-network

  # ============================================================================
