# ==============================================================================
# Redis Custom Configuration for Local Development
# ==============================================================================

# Network Settings
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Settings
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# Snapshotting (RDB Persistence)
# Save database state to disk on local systems:
# - after 3600 seconds (1 hr) if at least 1 key changed
# - after 300 seconds (5 min) if at least 100 keys changed
# - after 60 seconds if at least 10000 keys changed
save 3600 1
save 300 100
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# Append Only Mode (AOF Persistence)
appendonly no # Keep disabled for development to speed up operations

# Memory Management
# Restrict Redis memory footprint to avoid choking developer system resources
maxmemory 256mb
maxmemory-policy allkeys-lru

# Lazy Freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
